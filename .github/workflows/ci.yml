name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Placeholders only — these tests never make a real Supabase/Claude
      # call (routes that touch either are mocked). They exist so the
      # shared client modules' env-var guard doesn't throw at import time.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_KEY: ci-placeholder-service-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        working-directory: apps/backend
        run: npx tsc --noEmit
      - name: Test
        working-directory: apps/backend
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Test
        working-directory: apps/mobile
        run: npm test
